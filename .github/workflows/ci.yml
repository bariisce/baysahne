name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baysahne
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: baysahne_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baysahne" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://baysahne:ci_only_password@localhost:5432/baysahne_test
      DATABASE_URL: postgresql+psycopg://baysahne:ci_only_password@localhost:5432/baysahne_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install ".[dev]"
      - run: ruff check app tests
      - run: pytest -p no:warnings

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx jest --ci
