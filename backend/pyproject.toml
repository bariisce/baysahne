[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "baysahne-backend"
version = "0.1.0"
description = "Bay Sahne API, admin backend and notification worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "pillow==12.3.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
s3 = ["boto3==1.43.114"]
dev = ["pytest==9.1.1", "ruff==0.17.1", "boto3==1.43.114", "moto[s3]==5.2.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"alembic/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
